name: Retire dead listings

# Sweeps a slice of the board's apply links and commits the verdicts. Kept
# separate from the deploy workflow on purpose: it makes outbound requests to
# hundreds of employer sites, and that should never be able to hold up or fail
# a deploy. The nightly deploy picks up whatever this last committed.
#
# The budget and the cadence together set the coverage: 1,500 checks every six
# hours is 6,000 a day, so every listing on a ~11k board is re-checked roughly
# every other day, without ever asking one host for more than a few pages.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "How many listings to check this run"
        required: false
        default: "1500"

concurrency:
  group: liveness
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      ANYWHERE_LIVE: "false"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Sweep
        run: npx tsx scripts/check-liveness.ts --budget ${{ inputs.budget || '1500' }}

      - name: Commit the verdicts
        run: |
          if git diff --quiet -- src/lib/generated/job-liveness.json src/lib/generated/retired-jobs.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/generated/job-liveness.json src/lib/generated/retired-jobs.json
          # [skip ci] so this does not trigger a deploy of its own; the nightly
          # build is what publishes the result.
          git commit -m "liveness sweep [skip ci]"
          git push
