name: Refresh job descriptions

# Captures the employers' own job descriptions and commits the rebuilt dataset.
#
# This exists because the capture files are too large for git — job-content.json
# alone is 41 MB — so the deploy build cannot reproduce them and deliberately
# refuses to regenerate the dataset without them (see scripts/build-curated.ts).
# Without this workflow, refreshing descriptions would be a thing a person has
# to remember to do on a laptop.
#
# Kept separate from the deploy for the same reason the liveness sweep is: it
# makes thousands of outbound requests to employer sites, and that must never be
# able to hold up or fail a deploy. The nightly deploy picks up whatever this
# last committed.

on:
  schedule:
    # Twice a week, a few hours before the nightly deploy.
    - cron: "0 1 * * 1,4"
  workflow_dispatch:
    inputs:
      generic_budget:
        description: "How many non-ATS listings to attempt this run"
        required: false
        default: "3000"

concurrency:
  group: enrich
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANYWHERE_LIVE: "false"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The ATS board sweep: verifies every listing is still open and is the
      # role we say it is, and captures the full description.
      - name: Capture from ATS boards
        run: npx tsx scripts/verify-and-enrich.ts

      # The long tail: Greenhouse behind a custom hostname, and JobPosting
      # JSON-LD embedded in the employer's page.
      - name: Capture from the long tail
        run: npx tsx scripts/enrich-generic.ts --budget ${{ inputs.generic_budget || '3000' }}

      # Rebuild the committed dataset from the captures.
      - name: Rebuild the dataset
        run: npm run prebuild

      - name: Commit the rebuilt dataset
        run: |
          FILES="src/lib/generated/curated-jobs.json src/lib/generated/snapshot.json src/lib/generated/retired-jobs.json src/lib/generated/job-verdicts.json"
          if git diff --quiet -- $FILES; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $FILES
          # [skip ci] so this does not trigger a deploy of its own; the nightly
          # build is what publishes the result.
          git commit -m "refresh job descriptions [skip ci]"
          git push
